name: Private Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: unzip -q Yunari-Android-Project.zip -d build-source

      - name: Keep test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: yunari-debug-signing-v1

      - name: Build APK
        working-directory: build-source/Yunari-Play/android
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug

      - name: Prepare download
        run: cp build-source/Yunari-Play/android/app/build/outputs/apk/debug/app-debug.apk Yunari-Play.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Yunari-Play-APK
          path: Yunari-Play.apk
          if-no-files-found: error
          retention-days: 7
