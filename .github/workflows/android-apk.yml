name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-apk.yml']
permissions:
  contents: write
concurrency:
  group: android-apk
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore install signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: yunari-debug-signing-v1
      - name: Build and check
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Yunari-Play.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Yunari-Play-APK
          path: Yunari-Play.apk
          if-no-files-found: error
      - name: Publish install download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          gh release create "android-build-$RUN_NUMBER" Yunari-Play.apk --target "$BUILD_SHA" --prerelease --title "윤아리 놀이터 Android $RUN_NUMBER" --notes "안드로이드 설치용 시험판입니다. APK를 내려받아 설치하세요. 현재 음성은 휴대폰 TTS를 사용합니다."
