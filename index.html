/* ===== v2: 개수 세기(counting) UI ===== */
.count-card{width:100%;background:#fffdf7;border:3px solid #fff;border-radius:26px;box-shadow:0 6px 0 #e9e4d5;padding:14px 8px;min-height:212px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:transform .18s,box-shadow .18s}
.object-choice.count-mode{min-height:auto;padding:6px 2px}
.object-choice.count-mode:hover .count-card{transform:translateY(-4px)}
.object-choice.count-mode:after{content:none!important}
.object-choice.count-mode.good .count-card{border-color:#8dc4a3;box-shadow:0 0 0 5px #cfe8da,0 6px 0 #bcd9c6;animation:card-pop .45s ease-out}
.object-choice.count-mode.miss .count-card{border-color:#f0c795;animation:nudge .45s ease-in-out}
.object-choice.count-mode.reveal .count-card{border-color:#8dc4a3;border-style:dashed}
.object-choice.count-mode:disabled{opacity:1}
@keyframes card-pop{0%{transform:scale(1)}45%{transform:scale(1.05)}100%{transform:scale(1)}}
.count-row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:5px;max-width:100%}
.ci{width:var(--sz,48px);height:var(--sz,48px);flex:none;animation:ci-in .35s backwards}
.ci.hand{width:calc(var(--sz,48px) * 1.15);height:calc(var(--sz,48px) * 1.28)}
@keyframes ci-in{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
.bundles{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;align-items:center}
.bundle{display:grid;grid-template-columns:repeat(5,auto);gap:2px;padding:5px;border-radius:14px;background:#f5f8ef;border:2px dashed #c8d9bb}
.digit-pop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#ffffffee;border-radius:24px;padding:10px 20px;font-size:50px;font-weight:900;color:#4b8a72;box-shadow:0 6px 0 #cbdfd1;line-height:1;animation:badge-in .45s both;pointer-events:none;text-align:center}
.digit-pop small{display:block;font-size:15px;color:#7d8d84;margin-top:6px;font-weight:700}
.count-hint{font-size:13px;color:#8b968d;text-align:center;margin:2px 0 0}
.chip-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.prompt-bubble .sub{display:block;font-size:13px;color:#8b968d;margin-top:6px;font-weight:600}
.range-preview .count-row{gap:4px}
@media(max-width:700px){
 .count-card{min-height:178px;padding:10px 4px;border-radius:22px}
 .object-choices{gap:9px}
 .digit-pop{font-size:40px;padding:8px 15px}
 .digit-pop small{font-size:12px}
 .bundle{gap:1px;padding:4px;border-radius:11px}
}


/* ===== v3: 진짜 앱 셸 ===== */
html{height:100%}
body{height:100dvh;min-height:100vh;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none}
header{flex:none;width:100%;max-width:none;background:#fffdf8;border-bottom:1px solid #f0ece1;padding:14px 22px;padding-top:calc(14px + env(safe-area-inset-top))}
header>*{max-width:1100px}
header{justify-content:center;gap:0}
.header-in{width:100%;max-width:1100px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.app{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;max-width:none;width:100%;padding:0;scrollbar-width:none}
.app::-webkit-scrollbar{display:none}
.app>.page-enter{max-width:1100px;margin:0 auto;padding:6px 26px 26px}
.tabbar{flex:none;display:flex;background:#fffdf8;border-top:1px solid #efebe0;padding:6px 8px;padding-bottom:calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px #b9b09a1a;z-index:3}
.tab{flex:1;background:none;border:0;border-radius:18px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#96a09a;font-size:11px;font-weight:800;min-height:56px;transition:color .15s,background .15s}
.tab .tab-ico{font-size:21px;line-height:1;font-weight:900;letter-spacing:-1px}
.tab.on{color:#4f8f79;background:#eef5ef}
.tab:active{transform:scale(.95)}
@media(max-width:700px){
 header{padding:11px 16px;padding-top:calc(11px + env(safe-area-inset-top))}
 .app>.page-enter{padding:4px 15px 20px}
 .tab{font-size:10px;min-height:52px}
 .tab .tab-ico{font-size:19px}
}
/* 큰 한글 낱말 문제 */
.prompt-bubble .bigword{display:block;font-style:normal;font-size:1.55em;font-weight:900;color:#3f7f6a;letter-spacing:-1.5px;line-height:1.15}
.range-grid{margin:18px auto 6px}
.range-button{transition:transform .15s}
.range-button:active{transform:translateY(3px);box-shadow:0 1px 0 #e9e7dc}
/* 새 오브젝트 */
.object-choice.mode-card svg{animation:float 4.4s ease-in-out infinite}
.object-choice.mode-wheel svg{animation:ball-idle 3.6s ease-in-out infinite}
.object-choice.mode-block svg{animation:ball-idle 3.8s ease-in-out infinite}
.object-choice.mode-cake svg{animation:float 4s ease-in-out infinite}
.object-choice.mode-train svg{animation:bus-idle 2.3s ease-in-out infinite}
.object-choice.good.mode-card svg{animation:gift-open .7s ease-out forwards}
.object-choice.good.mode-wheel svg{animation:wheel-win .9s ease-out forwards}
.object-choice.good.mode-block svg{animation:ball-win .7s ease-in-out forwards}
.object-choice.good.mode-cake svg{animation:bloom .7s ease-out forwards}
.object-choice.good.mode-train svg{animation:drive-away .9s ease-in forwards}
@keyframes wheel-idle{to{transform:rotate(360deg)}}
@keyframes wheel-win{to{transform:rotate(540deg) scale(1.1)}}


.primary.auto{position:relative;overflow:hidden}
.primary.auto:after{content:'';position:absolute;left:0;bottom:0;height:5px;background:#ffffff9c;width:100%;transform-origin:left;animation:auto-bar var(--wait,1500ms) linear forwards}
@keyframes auto-bar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.motion-off .primary.auto:after{display:none}

/* ===== 가로 모드(landscape) 자동 최적화 ===== */

 header{padding:6px 18px;padding-top:calc(6px + env(safe-area-inset-top))}

 .back{min-height:38px;padding:8px 13px;font-size:12px}

 .page-title p{font-size:11px}
 .eyebrow{font-size:9px}

 /* 홈 */
 .home-hero{min-height:0;padding:16px 26px 0;border-radius:26px;grid-template-columns:1.1fr 1fr}

 .hero-copy p{font-size:11px;margin-bottom:12px}
 .hero-teacher{height:172px;margin:0;width:100%}

 .home-subtitle{margin:14px 4px 10px}
 .home-subtitle h2{font-size:16px}
 .subject-grid{grid-template-columns:repeat(3,1fr);gap:12px}
 .subject-card{min-height:0;padding:14px 16px;border-radius:22px}
 .subject-card .subject-symbol{font-size:36px;margin:4px 0 10px}
 .subject-card h2{font-size:16px}
 .subject-card p{font-size:10px;max-width:none}
 .subject-card .go{width:26px;height:26px;font-size:17px;right:12px;bottom:12px}
 .subject-card .tiny-shape{font-size:20px;top:10px;right:12px}

 /* 놀이 선택 */
 .activity-grid{grid-template-columns:repeat(4,1fr);gap:11px}
 .activity-card{display:block;padding:12px;border-radius:20px}
 .activity-ill{height:78px;border-radius:15px}
 .activity-ill svg{height:76px;width:96px}
 .activity-card h2{font-size:15px;margin:8px 0 2px}
 .activity-card p{font-size:10px;line-height:1.45}
 .activity-card .tag{font-size:9px;margin-top:7px;padding:4px 7px}

 /* 숫자 범위 · 테마 */
 .range-grid{grid-template-columns:repeat(5,1fr);gap:9px;margin:10px auto 4px;max-width:none}
 .range-button{min-height:54px;font-size:17px;padding:8px 4px}
 .range-button small{font-size:9px;margin-top:3px}
 .range-preview{display:none}
 .theme-grid{grid-template-columns:repeat(5,1fr);gap:11px}
 .theme-card .thumb{height:70px}
 .theme-card h3{font-size:13px;margin:7px 0 2px}
 .theme-card p{font-size:10px}
 .panel{padding:15px 16px;border-radius:24px}
 .note{font-size:11px;line-height:1.55}

 /* 게임 무대: 왼쪽 안내 / 오른쪽 선택지 2단 */
 .play-top{padding:2px 0 6px;font-size:11px}
 .stage{min-height:0;padding:13px 16px;border-radius:22px}
 .quiz-stage{display:grid;grid-template-columns:minmax(180px,.8fr) 1.2fr;grid-template-rows:auto auto auto auto;column-gap:18px;row-gap:4px;align-content:center}
 .stage:before{height:50px;bottom:-20px}
 .quiz-stage .teacher-prompt{grid-column:1;grid-row:1;margin:0;gap:9px}
 .teacher-mini{width:50px;height:70px}
 .teacher-mini svg{width:88px;height:120px;margin-left:-19px}
 .prompt-bubble{padding:11px 13px;border-radius:18px}
 .prompt-bubble h2{font-size:17px}
 .prompt-bubble .bigword{font-size:1.5em}
 .prompt-bubble .sub{font-size:11px;margin-top:3px}
 .quiz-stage .chip-row{grid-column:1;grid-row:2;justify-content:flex-start;margin-top:6px}
 .quiz-stage .listen{margin:0;padding:9px 13px;font-size:12px;min-height:40px}
 .quiz-stage .object-choices{grid-column:2;grid-row:1 / 5;margin:0;gap:14px;align-self:center}
 .object-choice{min-height:0;padding:2px 0}
 .object-choice svg{height:158px;max-width:200px}
 .object-choice.good:after{width:66px;height:66px;font-size:52px}
 .count-card{min-height:150px;padding:10px 6px}
 .digit-pop{font-size:38px;padding:7px 14px}
 .quiz-stage .feedback{grid-column:1;grid-row:3;min-height:0;font-size:14px;margin:8px 0 0;text-align:left;place-items:start}
 .quiz-stage .game-next-wrap{grid-column:1;grid-row:4;min-height:0;text-align:left;margin-top:8px}
 .quiz-stage .primary{font-size:14px;padding:12px 20px;min-height:44px}
 .stage-decor{display:none}
 .footer{margin-top:8px;font-size:10px}

 /* 순서대로 채우기 */
 .seq-grid{grid-template-columns:repeat(10,1fr);gap:5px;max-width:none;margin:8px 0}
 .seq-object{min-height:0}
 .seq-object svg{height:74px}
 .seq-object:last-child{grid-column:auto}
 .seq-number{font-size:21px;min-width:30px}
 .seq-object.filled:after{inset:28% 22%;font-size:19px}
 .seq-counter{font-size:12px}
 .progress{margin:8px 0}

 /* 따라 쓰기 */
 .trace-scenes{grid-template-columns:repeat(3,1fr);gap:12px}
 .trace-card{display:block;padding:12px}
 .trace-card .board-demo{height:74px;font-size:38px}
 .trace-card h3{font-size:14px;margin:8px 0 2px}
 .trace-card p{font-size:10px}
 .letters{grid-template-columns:repeat(8,1fr);gap:8px}
 .letter{font-size:22px;padding:9px 4px}
 .letter small{font-size:10px;margin-top:2px}
 .trace-panel{display:grid;grid-template-columns:1fr auto;column-gap:20px;align-items:center;padding:14px 18px}
 .trace-panel h2{grid-column:1;font-size:19px;margin:2px 0}
 .trace-panel .combine{grid-column:1;font-size:22px;margin:6px}
 .trace-panel .listen{grid-column:1}
 .trace-panel .muted{grid-column:1;font-size:11px;margin:6px 0}
 .trace-panel .canvas-wrap{grid-column:2;grid-row:1 / 7;max-width:none;width:190px}
 .trace-panel .feedback{grid-column:1;font-size:14px;min-height:0;margin:6px 0}
 .trace-panel .secondary,.trace-panel .primary{grid-column:1;font-size:12px;padding:11px 15px;min-height:42px}

 /* 결과 */
 .result-panel{padding:16px}
 .result-scene{height:150px;max-width:340px;margin:6px auto 0}
 .result-scene .teacher{height:160px;width:150px;left:10px}
 .result-scene .award{width:96px;height:100px;top:20px}
 .result-panel .score{font-size:34px;margin:6px}
 .result-panel h2{font-size:19px;margin:6px 0}
 .result-panel .muted{font-size:11px}
 .actions{margin-top:12px;gap:9px}
 .actions .primary,.actions .secondary{font-size:13px;padding:12px 18px;min-height:44px}

 /* 첫 인사 */
 .welcome>div{max-width:520px;padding:18px 24px}
 .welcome svg{height:108px}
 .welcome h2{font-size:19px;margin:8px 0}
 .welcome p{font-size:12px;margin:6px 0 14px}
 .welcome .primary{font-size:15px;padding:13px 22px;min-height:46px}
 .setting-row{padding:11px 0}
}
@media (orientation:landscape) and (max-height:430px){
 .hero-teacher{height:140px}
 .hero-copy h1{font-size:21px}
 .object-choice svg{height:128px}
 .count-card{min-height:124px}
 .seq-object svg{height:62px}
 .trace-panel .canvas-wrap{width:150px}
 .result-scene{height:120px}
 .result-scene .teacher{height:130px;width:120px}
}

@keyframes tile-in{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
.page-enter{animation:page-in .38s cubic-bezier(.2,.9,.3,1.05)}
@keyframes page-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.stage,.panel,.home-hero{animation:stage-in .45s cubic-bezier(.2,.9,.3,1.1) backwards}
@keyframes stage-in{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
.prompt-bubble{animation:bubble-in .48s cubic-bezier(.2,.9,.3,1.5) backwards;animation-delay:.1s;transform-origin:0 100%}
@keyframes bubble-in{from{opacity:0;transform:scale(.6) translateY(10px)}to{opacity:1;transform:none}}
.prompt-bubble .bigword{animation:word-in .55s cubic-bezier(.2,.9,.3,1.6) backwards;animation-delay:.22s;display:block}
@keyframes word-in{from{opacity:0;transform:scale(.4) rotate(-8deg)}60%{opacity:1;transform:scale(1.12) rotate(2deg)}to{opacity:1;transform:none}}
.teacher-mini svg{transform-origin:50% 90%}
.teacher-mini.cheer svg{animation:cheer .85s cubic-bezier(.3,.9,.4,1.2)}
@keyframes cheer{0%{transform:none}22%{transform:translateY(-13px) rotate(-6deg) scale(1.04)}48%{transform:translateY(0) rotate(5deg)}70%{transform:translateY(-6px) rotate(-3deg)}100%{transform:none}}
.hero-copy>*{animation:tile-in .55s cubic-bezier(.2,.9,.3,1.2) backwards}
.hero-copy>*:nth-child(1){animation-delay:.05s}.hero-copy>*:nth-child(2){animation-delay:.13s}.hero-copy>*:nth-child(3){animation-delay:.21s}.hero-copy>*:nth-child(4){animation-delay:.29s}
.hero-teacher{animation:hero-in .7s cubic-bezier(.2,.9,.3,1.25) backwards;animation-delay:.12s}
@keyframes hero-in{from{opacity:0;transform:translateY(28px) scale(.9)}to{opacity:1;transform:none}}
.round-dot{transition:background .25s}
.round-dot.done{animation:dot-pop .4s cubic-bezier(.2,.9,.3,1.8)}
@keyframes dot-pop{0%{transform:scale(1)}45%{transform:scale(1.9)}100%{transform:scale(1)}}
.round-dot.current{animation:dot-pulse 1.7s ease-in-out infinite}
@keyframes dot-pulse{0%,100%{box-shadow:0 0 0 3px #f9ead1}50%{box-shadow:0 0 0 7px #f9ead180}}
.subject-card,.activity-card,.theme-card,.trace-card,.range-button,.letter,.object-choice,.seq-object,.primary,.secondary,.listen,.back,.tab,.icon{transition:transform .16s cubic-bezier(.3,.9,.4,1.3),box-shadow .16s}
.subject-card:active,.activity-card:active,.theme-card:active,.trace-card:active,.letter:active{transform:scale(.955)}
.listen:active,.back:active,.icon:active,.secondary:active{transform:scale(.93)}
.tab:active .tab-ico{transform:scale(1.25)}
.tab .tab-ico{transition:transform .18s cubic-bezier(.2,.9,.3,1.6)}
.tab.on .tab-ico{animation:tab-bounce .45s cubic-bezier(.2,.9,.3,1.6)}
@keyframes tab-bounce{0%{transform:scale(1)}40%{transform:scale(1.3) translateY(-3px)}100%{transform:scale(1)}}
.object-choice:not(:disabled):active svg,.object-choice:not(:disabled):active .count-card{transform:scale(.94)}
.feedback.flash{animation:fb-in .45s cubic-bezier(.2,.9,.3,1.4)}
@keyframes fb-in{from{opacity:0;transform:translateY(10px) scale(.9)}to{opacity:1;transform:none}}
.digit-pop{animation:digit-in .6s cubic-bezier(.2,.9,.3,1.7) both}
@keyframes digit-in{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-18deg)}55%{opacity:1;transform:translate(-50%,-50%) scale(1.18) rotate(5deg)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
/* 정답 반짝임 */
.burst{position:absolute;width:0;height:0;pointer-events:none;z-index:4}
.burst i{position:absolute;left:0;top:0;font-style:normal;font-size:22px;color:var(--c);transform:rotate(var(--a)) translateY(0);animation:burst-out var(--t) cubic-bezier(.15,.7,.4,1) var(--dl) forwards;opacity:0}
@keyframes burst-out{0%{opacity:0;transform:rotate(var(--a)) translateY(0) scale(.4)}25%{opacity:1}100%{opacity:0;transform:rotate(var(--a)) translateY(calc(var(--d) * -1)) scale(1.15)}}

@keyframes award-in{0%{opacity:0;transform:scale(.2) rotate(-40deg)}60%{opacity:1;transform:scale(1.2) rotate(12deg)}100%{opacity:1;transform:none}}
.result-panel .score{animation:score-in .6s cubic-bezier(.2,.9,.3,1.6) both;animation-delay:.25s}
@keyframes score-in{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.result-panel h2{animation:tile-in .5s backwards;animation-delay:.5s}
.result-panel .actions{animation:tile-in .5s backwards;animation-delay:.65s}
.result-scene .teacher{animation:cheer 1.1s cubic-bezier(.3,.9,.4,1.2) .35s 2}
/* 순서 채우기 */
.seq-object.filled:after{animation:badge-in .45s cubic-bezier(.2,.9,.3,1.8) both}
.seq-object.hint{animation:hint-wobble 1s ease-in-out infinite}
@keyframes hint-wobble{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) scale(1.04)}}
.progress div{transition:width .45s cubic-bezier(.2,.9,.3,1.1)}
/* 설치/환영 팝업 */
.welcome>div{animation:pop-in .5s cubic-bezier(.2,.9,.3,1.45) both}
@keyframes pop-in{from{opacity:0;transform:scale(.8) translateY(20px)}to{opacity:1;transform:none}}

/* ===== v3 · 놀이터 확장 (끄적이기 · 무궁화꽃 · 홈 연출) ===== */
.home-hero{cursor:pointer}
.hero-teacher{transition:transform .2s}
.hero-teacher.tapped .teacher{animation:teacher-hop .8s ease-out}
@keyframes teacher-hop{0%{transform:translateY(0) rotate(0)}25%{transform:translateY(-22px) rotate(-5deg)}50%{transform:translateY(0) rotate(0)}70%{transform:translateY(-12px) rotate(4deg)}100%{transform:translateY(0)}}
.home-sun{position:absolute;left:5%;top:14px;width:62px;height:62px;z-index:-1}
.home-sun span{display:block;width:100%;height:100%;border-radius:50%;background:radial-gradient(#fff3c4,#f7d178);box-shadow:0 0 0 12px #fbe6ae55;animation:sun-pulse 5s ease-in-out infinite}
@keyframes sun-pulse{50%{transform:scale(1.09)}}
.home-butterfly{position:absolute;width:44px;height:44px;left:8%;top:150px;z-index:2;animation:bfly 14s linear infinite}
.home-butterfly svg{width:100%;height:100%;animation:sway 1s ease-in-out infinite}
@keyframes bfly{0%{transform:translate(0,0)}25%{transform:translate(120px,-45px)}50%{transform:translate(230px,20px)}75%{transform:translate(110px,60px)}100%{transform:translate(0,0)}}
.home-petals{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.home-petals i{position:absolute;top:-24px;left:var(--x);font-style:normal;font-size:var(--s);color:#f3c6cf;animation:petal-fall var(--d) linear infinite;animation-delay:var(--dl);opacity:.85}
@keyframes petal-fall{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(400px) rotate(420deg)}}
.subject-card{animation:tile-in .5s backwards}
.subject-card:active{transform:scale(.96)}
@keyframes tile-in{from{opacity:0;transform:translateY(18px) scale(.94)}60%{transform:translateY(-5px) scale(1.02)}to{opacity:1;transform:none}}
.tab{transition:color .15s,background .15s,transform .15s}
.tab.on .tab-ico{animation:tab-bounce .45s}
@keyframes tab-bounce{0%{transform:translateY(0)}40%{transform:translateY(-7px) scale(1.15)}100%{transform:translateY(0)}}

/* --- 놀이 메뉴 --- */
.fun-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.fun-card{position:relative;text-align:left;border-radius:28px;padding:20px 22px;min-height:210px;border:2px solid #fff;background:var(--soft);box-shadow:0 6px 0 var(--shadow);overflow:hidden;animation:tile-in .5s backwards;transition:transform .18s}
.fun-card:active{transform:scale(.97)}
.fun-card .fun-ico{display:block;font-size:56px;line-height:1;margin-bottom:12px}
.fun-card h2{font-size:21px;margin:0}
.fun-card p{font-size:12px;color:#77837d;margin:7px 0 0}
.fun-card .go{position:absolute;right:16px;bottom:18px;width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:21px;color:var(--accent)}

/* --- 끄적이기 --- */
.dd-wrap{background:#fff;border:2px solid #fff;box-shadow:0 5px 0 #e9e5da;border-radius:28px;padding:12px}
.dd-paper{position:relative;border-radius:20px;overflow:hidden;background:#fffdf5;border:2px dashed #e0e4d4}
#dd-canvas{display:block;width:100%;height:58vh;min-height:300px;touch-action:none;aspect-ratio:auto;background:transparent}
.dd-hint{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;color:#b3bdb2;pointer-events:none;transition:opacity .3s}
.dd-hint.hide{opacity:0}
.dd-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-top:12px}
.dd-colors{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.dd-sw{width:38px;height:38px;border-radius:50%;background:var(--c);box-shadow:0 2px 0 #00000018,inset 0 0 0 3px #fff;transition:transform .15s}
.dd-sw.on{transform:scale(1.22);box-shadow:0 0 0 3px #7fae97,inset 0 0 0 3px #fff}
.dd-sw.eraser{background:#fff;color:#8c9a92;font-size:19px;display:grid;place-items:center;box-shadow:0 2px 0 #dcdfd4,inset 0 0 0 2px #e2e6da}
.dd-sw.eraser.on{box-shadow:0 0 0 3px #7fae97,inset 0 0 0 2px #e2e6da}
.dd-sizes{display:flex;gap:7px}
.dd-size{width:44px;height:38px;border-radius:14px;background:#f2f5ee;display:grid;place-items:center}
.dd-size i{display:block;background:#5c7a6d;border-radius:50%;width:var(--d);height:var(--d)}
.dd-size.on{background:#dcebdf;box-shadow:0 0 0 2px #7fae97 inset}
.dd-clear{background:#fff;border-radius:50px;box-shadow:0 3px 0 #e9dfd3;padding:11px 18px;font-weight:800;font-size:14px;color:#a5714f}
.dd-note{text-align:center;font-size:12px;color:#95a09a;margin:10px 0 0}

/* --- 무궁화 꽃이 피었습니다 --- */
.mg-stage{position:relative;isolation:isolate;border-radius:30px;overflow:hidden;border:3px solid #fff;box-shadow:0 6px 0 #ebe6d9;background:linear-gradient(#dff0f6 0%,#eaf5e2 58%,#cfe3b6 58%);height:min(66vh,470px);touch-action:manipulation;user-select:none}
.mg-cloud{position:absolute;width:86px;height:26px;border-radius:40px;background:#ffffffcc;animation:cloud-drift 11s ease-in-out infinite}
.mg-cloud:before,.mg-cloud:after{content:'';position:absolute;border-radius:50%;background:inherit;width:34px;height:34px;top:-14px;left:14px}
.mg-cloud:after{width:42px;height:42px;left:38px;top:-21px}
.mg-tree{position:absolute;left:50%;top:6px;transform:translateX(-50%);width:132px;z-index:0}
.mg-tree svg{width:100%;height:auto}
.mg-tagger{position:absolute;left:50%;top:44px;transform:translateX(-50%);width:108px;height:130px;z-index:2}
.mg-tagger svg{width:100%;height:100%;overflow:visible}
.mg-tagger .face-on{display:none}
.mg-tagger.look .face-on{display:block}
.mg-tagger.look .back-on{display:none}
.mg-tagger.turning{animation:tagger-turn .34s ease-out}
@keyframes tagger-turn{0%{transform:translateX(-50%) scaleX(1)}50%{transform:translateX(-50%) scaleX(.12)}100%{transform:translateX(-50%) scaleX(1)}}
.mg-tagger.win{animation:cheer-hop .7s ease-out infinite}
@keyframes cheer-hop{0%,100%{transform:translateX(-50%) translateY(0)}45%{transform:translateX(-50%) translateY(-16px)}}
.mg-kid{position:absolute;left:50%;bottom:16px;width:86px;height:96px;margin-left:-43px;z-index:3;transition:transform .12s linear}
.mg-kid svg{width:100%;height:100%}
.mg-kid.moving svg{animation:kid-walk .32s ease-in-out infinite}
@keyframes kid-walk{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-9px) rotate(3deg)}}
.mg-kid.caught svg{animation:kid-oops .5s ease-in-out}
@keyframes kid-oops{25%{transform:translateX(-9px) rotate(-8deg)}60%{transform:translateX(9px) rotate(8deg)}}

function sequenceBurst(el,big=false){

 layer.innerHTML=Array.from({length:big?44:16},(_,i)=>`<i style="--a:${i*137.5}deg;--r:${big?100+Math.random()*170:30+Math.random()*65}px;--color:${['#f3b54c','#ef7aaa','#86bdf5','#83c7a0'][i%4]}">${i%3?'✦':'●'}</i>`).join('');setTimeout(()=>layer.remove(),1100);

async function fill(n){
 if(state.view!=='sequence'||state.moving||state.filled===10||n<state.next)return;
 const token=screenId,el=$('cup-'+n);
 if(n!==state.next){
  el.classList.remove('seq-wrong');void el.offsetWidth;el.classList.add('seq-wrong');
  $('seq-feedback').textContent='× 순서가 달라요. 다시 골라 보세요.';ensureAudio();if(sfxGain)tone(77,.12,.4,sfxGain);
  setTimeout(()=>{if(token===screenId)el.classList.remove('seq-wrong')},650);return;
 }
 state.moving=true;el.disabled=true;el.classList.remove('seq-wrong');effect('step');
 const slot=$('slot-'+n),rect=el.getBoundingClientRect(),dest=slot.getBoundingClientRect();
 const flight=el.cloneNode(true);flight.removeAttribute('id');flight.removeAttribute('onclick');flight.className='seq-flight';flight.setAttribute('aria-hidden','true');
 Object.assign(flight.style,{position:'fixed',left:rect.left+'px',top:rect.top+'px',width:rect.width+'px',height:rect.height+'px',margin:'0'});

 flight.remove();if(token!==screenId||state.view!=='sequence')return;
 slot.innerHTML=`<span class="slot-art">${sequenceArt(n)}</span><b>${n}</b>`;slot.classList.remove('waiting');slot.classList.add('complete');slot.setAttribute('aria-label',`${n} 완성`);sequenceBurst(slot);
 state.next++;state.filled++;state.moving=false;$('seq-bar').style.width=state.filled*10+'%';$('seq-counter').textContent=state.filled+' / 10';
 if(state.filled===10){
  effect();$('seq-prompt').textContent='차곡차곡, 모두 완성!';$('seq-feedback').textContent='○ 정말 멋져요! 숫자 친구들이 모였어요!';sequenceBurst(document.querySelector('.seq-shelf'),true);
  $('seq-actions').innerHTML=`<div class="actions"><button class="primary" onclick="startSequence(${(state.range+1)%10})">${state.range===9?'1~10 다시 출발':'다음 숫자 나라'} →</button><button class="secondary" onclick="startSequence(${state.range})">새 테마로 또 놀기</button></div>`;say('모두 완성했어요! 정말 멋져요!');
 }else{$('slot-'+state.next).classList.add('waiting');$('seq-prompt').textContent=`이번에는 ${state.next}!`;$('seq-feedback').textContent='○ 쏙! 제자리를 찾았어요!';say(koSino(n))}
}

function paintCanvas(current=[]){const canvas=$('trace-canvas');if(!canvas)return;const ctx=canvas.getContext('2d'),paths=scaledPaths(),t=TRACE_WORLDS.find(t=>t.id===nav.traceTheme)||TRACE_WORLDS[0];ctx.clearRect(0,0,600,600);line(ctx,[[300,10],[300,590]],t.guide,1,[5,12]);line(ctx,[[10,300],[590,300]],t.guide,1,[5,12]);paths.forEach(p=>line(ctx,p,t.guide,36));state.completed.forEach((p,i)=>line(ctx,p,nav.traceTheme==='rainbow'?['#b182bf','#80afac','#e0b36e','#c28d9d'][i%4]:t.stroke,t.width));if(!state.traceDone){const p=paths[state.stroke];line(ctx,p,t.stroke,5,[9,13]);const[x,y]=p[0],end=p[1],angle=Math.atan2(end[1]-y,end[0]-x);ctx.fillStyle='#458c70';ctx.beginPath();ctx.arc(x,y,23,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 25px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(state.stroke+1,x,y);const ax=x+Math.cos(angle)*62,ay=y+Math.sin(angle)*62;line(ctx,[[ax-Math.cos(angle-.6)*19,ay-Math.sin(angle-.6)*19],[ax,ay],[ax-Math.cos(angle+.6)*19,ay-Math.sin(angle+.6)*19]],'#6dc29a',6)}if(current.length)line(ctx,current,t.stroke,t.width)}

function ddSetup(){const c=$('dd-canvas');if(!c)return;const dpr=dd.dpr=Math.min(3,window.devicePixelRatio||1);
 const fit=()=>{const r=c.getBoundingClientRect();const w=Math.round(r.width*dpr),h=Math.round(r.height*dpr);if(!w||!h)return;let old=null;if(c.width&&dd.drawn){old=document.createElement('canvas');old.width=c.width;old.height=c.height;old.getContext('2d').drawImage(c,0,0)}c.width=w;c.height=h;const ctx=dd.ctx=c.getContext('2d');ctx.lineCap='round';ctx.lineJoin='round';if(old)ctx.drawImage(old,0,0,w,h)};

 let last=null,pid=null;
 const pos=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*dd.dpr,(e.clientY-r.top)*dd.dpr]};
 const width=e=>{const base=DD_W[dd.size]*dd.dpr*(dd.eraser?1.9:1);if(e.pointerType==='pen'){const p=e.pressure>0?e.pressure:.5;return base*(.35+p*1.15)}return base};

 const end=e=>{if(pid===null)return;pid=null;last=null};
 c.onpointerup=end;c.onpointercancel=end;c.onpointerleave=end;
 c.oncontextmenu=e=>e.preventDefault()}
